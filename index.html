
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuck Norris Jokes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <img
            src="https://api.chucknorris.io/img/chucknorris_logo_coloured_small@2x.png"
            alt="Logo de Chuck Norris"
        >
        <h1>Chuck Norris Jokes</h1>
        <p>El hombre, el mito, la leyenda.</p>
    </header>

    <main>
        <section class="joke-card">
            <h2>Chiste 1</h2>
            <p id="joke1">Cargando chiste...</p>
            <button id="btn1">Otro chiste</button>
        </section>

        <section class="joke-card">
            <h2>Chiste 2</h2>
            <p id="joke2">Cargando chiste...</p>
            <button id="btn2">Otro chiste</button>
        </section>

        <section class="joke-card">
            <h2>Chiste 3</h2>
            <p id="joke3">Cargando chiste...</p>
            <button id="btn3">Otro chiste</button>
        </section>

        <section class="category-section">
            <h2>Chistes por categoría</h2>
            <select id="category">
                <option value="">Selecciona una categoría</option>
            </select>
            <button id="categoryBtn">Buscar chiste</button>
            <p id="categoryJoke">Aquí aparecerá tu chiste.</p>
        </section>
    </main>

    <footer>
        <p>Proyecto de práctica de APIs</p>
    </footer>

</body>
</html>
